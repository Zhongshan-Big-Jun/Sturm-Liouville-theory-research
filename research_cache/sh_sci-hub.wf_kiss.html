(function(){
var TOKEN="1785529009.6732908a4c50a99e0df543e11bc04abdc5fe650f5b6da74583e622523d940b0e";

function step(){
var end=nonce+BATCH;
for(;nonce<end;nonce++){
if(SHA256(TOKEN+':'+nonce).indexOf(prefix)===0){

// crude progress: grows toward ~90% over expected work
