claude:
  cli_path: "claude"
  permission_mode: "bypassPermissions"
  provider: "api_key"
  api_key:
    model: "claude-fable-5"
    key: ""

codex:
  cli_path: "codex"
  model: "gpt-5.6-sol"
  reasoning_effort: "xhigh"

prover:
  mode: "decomposition"

pipeline:
  literature_survey:
    provider: "codex"
    model: "gpt-5.6-sol"
    reasoning_effort: "xhigh"
  proof_summary:
    provider: "codex"
    model: "gpt-5.6-sol"
    reasoning_effort: "xhigh"

decomposition:
  max_proof_attempts: 1
  max_revisions: 1
  max_decompositions: 1
  models:
    decomposer:
      provider: "codex"
      model: "gpt-5.6-sol"
      reasoning_effort: "xhigh"
    single_prover:
      provider: "codex"
      model: "gpt-5.6-sol"
      reasoning_effort: "xhigh"
    regulator:
      provider: "codex"
      model: "gpt-5.6-sol"
      reasoning_effort: "xhigh"
    structural_verifier:
      provider: "codex"
      model: "gpt-5.6-sol"
      reasoning_effort: "xhigh"
    detailed_verifier:
      provider: "codex"
      model: "gpt-5.6-sol"
      reasoning_effort: "xhigh"
    verdict:
      provider: "codex"
      model: "gpt-5.6-sol"
      reasoning_effort: "xhigh"
